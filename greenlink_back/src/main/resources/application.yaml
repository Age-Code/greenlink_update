spring:
  config:
    import:
      - optional:classpath:/yaml/application-keys.yaml

  jpa:
    hibernate:
      # 운영에서는 JPA_DDL_AUTO=validate로 두고 스키마 변경은 별도로 관리한다.
      # 현재 저장소에는 migration 도구가 없어 기본값은 update를 유지한다.
      ddl-auto: ${JPA_DDL_AUTO:update}
    # SQL 로그는 운영에서 기본 비활성. 필요할 때만 JPA_SHOW_SQL=true로 켠다.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

greenlink:
  # 식물 사진 저장 위치 — Docker에서는 볼륨(/data/images)에 마운트한다.
  # 보관 기간이 지난 사진은 매일 새벽 정리하되, 식물별 최신 사진(썸네일)은 남긴다.
  storage:
    image-dir: ${GREENLINK_IMAGE_DIR:./data/images}
    image-retention-days: ${GREENLINK_IMAGE_RETENTION_DAYS:30}

  # 기본 데이터 부트스트랩 — DefaultDataInitializer
  #   seed-default-data: 빈 DB에 기본 식물(바질)과 가입 지급 아이템(바질 씨앗, 기본 화분)을 없을 때만 생성
  #   admin-email/admin-password: ADMIN이 한 명도 없을 때만 최초 관리자 생성(비밀번호 12자 이상).
  #     환경변수 GREENLINK_BOOTSTRAP_ADMIN_EMAIL / GREENLINK_BOOTSTRAP_ADMIN_PASSWORD로 주입하고,
  #     관리자 생성 후에는 제거한다.
  bootstrap:
    seed-default-data: ${GREENLINK_BOOTSTRAP_SEED_DEFAULT_DATA:true}

# jwt.secret은 소스에 두지 않는다.
# 환경변수(JWT_SECRET) 또는
# yaml/application-keys.yaml로 주입하며, 없으면 기동 시점에 실패한다.
# 필요한 항목은 yaml/application-keys.yaml.example 참고.
jwt:
  access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY_MS:86400000}


# Cloudflare 터널(또는 Nginx) 뒤에서 X-Forwarded-Proto/Host를 신뢰해
# 리다이렉트 URL이 https 공개 주소로 만들어지도록 한다.
server:
  forward-headers-strategy: framework

# OAuth 공급자 endpoint는 공개 값이므로 기본값을 둔다. client-id/secret만 환경변수로 주입한다.
oauth:
  kakao:
    token-uri: ${OAUTH_KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
    user-info-uri: ${OAUTH_KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
  google:
    token-uri: ${OAUTH_GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
    user-info-uri: ${OAUTH_GOOGLE_USER_INFO_URI:https://www.googleapis.com/oauth2/v3/userinfo}
