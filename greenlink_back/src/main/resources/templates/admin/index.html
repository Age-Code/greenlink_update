<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!-- Head -->
<th:block th:replace="~{includes/admin/head}" />

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        <th:block th:replace="~{includes/admin/sidebar}" />

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topper -->
                <th:block th:replace="~{includes/admin/topper}" />

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">운영 현황</h1>
                        <a href="/admin" class="btn btn-sm btn-outline-primary shadow-sm">
                            <i class="fas fa-sync-alt fa-sm"></i> 새로고침</a>
                    </div>

                    <!-- 요약 카드 -->
                    <div class="row">
                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card border-left-primary shadow h-100 py-2">
                                <div class="card-body">
                                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">사용자</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${dashboard.userCount}">0</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card border-left-success shadow h-100 py-2">
                                <div class="card-body">
                                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">키우는 식물 / 수확 완료</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800"
                                         th:text="${dashboard.growingPlantCount + ' / ' + dashboard.harvestedPlantCount}">0 / 0</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card shadow h-100 py-2"
                                 th:classappend="${dashboard.onlineDeviceCount < dashboard.deviceCount} ? 'border-left-warning' : 'border-left-info'">
                                <div class="card-body">
                                    <div class="text-xs font-weight-bold text-info text-uppercase mb-1">온라인 장치</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800"
                                         th:text="${dashboard.onlineDeviceCount + ' / ' + dashboard.deviceCount}">0 / 0</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card shadow h-100 py-2"
                                 th:classappend="${dashboard.failedCommandCount24h > 0} ? 'border-left-danger' : 'border-left-success'">
                                <div class="card-body">
                                    <div class="text-xs font-weight-bold text-danger text-uppercase mb-1">실패한 명령 (24시간)</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${dashboard.failedCommandCount24h}">0</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <!-- 장치 상태 -->
                        <div class="col-lg-5 mb-4">
                            <div class="card shadow">
                                <div class="card-header py-3">
                                    <h6 class="m-0 font-weight-bold text-primary">장치 연결 상태</h6>
                                    <div class="small text-gray-500">마지막 연결 후 30분이 지나면 오프라인으로 표시합니다.</div>
                                </div>
                                <div class="card-body p-0">
                                    <table class="table table-sm mb-0">
                                        <thead><tr><th>장치</th><th>종류</th><th>상태</th><th>마지막 연결</th></tr></thead>
                                        <tbody>
                                        <tr th:if="${#lists.isEmpty(dashboard.devices)}">
                                            <td colspan="4" class="text-center text-gray-500 py-3">등록된 장치가 없습니다.</td>
                                        </tr>
                                        <tr th:each="device : ${dashboard.devices}">
                                            <td th:text="${device.deviceName}"></td>
                                            <td th:text="${device.deviceType}"></td>
                                            <td>
                                                <span th:if="${!device.active}" class="badge badge-secondary">비활성</span>
                                                <span th:if="${device.active and device.online}" class="badge badge-success">온라인</span>
                                                <span th:if="${device.active and !device.online}" class="badge badge-warning">오프라인</span>
                                            </td>
                                            <td th:text="${device.lastConnectedAt != null ? #temporals.format(device.lastConnectedAt, 'MM-dd HH:mm') : '기록 없음'}"></td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- 최근 명령 -->
                        <div class="col-lg-7 mb-4">
                            <div class="card shadow">
                                <div class="card-header py-3">
                                    <h6 class="m-0 font-weight-bold text-primary">최근 장치 명령</h6>
                                </div>
                                <div class="card-body p-0">
                                    <table class="table table-sm mb-0">
                                        <thead><tr><th>요청 시각</th><th>명령</th><th>식물</th><th>상태</th><th>결과</th></tr></thead>
                                        <tbody>
                                        <tr th:if="${#lists.isEmpty(dashboard.recentCommands)}">
                                            <td colspan="5" class="text-center text-gray-500 py-3">명령 기록이 없습니다.</td>
                                        </tr>
                                        <tr th:each="command : ${dashboard.recentCommands}">
                                            <td th:text="${#temporals.format(command.requestedAt, 'MM-dd HH:mm:ss')}"></td>
                                            <td th:text="${command.commandType}"></td>
                                            <td th:text="${command.userPlantId != null ? command.userPlantId : '-'}"></td>
                                            <td>
                                                <span class="badge"
                                                      th:classappend="${command.commandStatus.name() == 'SUCCESS'} ? 'badge-success' : (${command.commandStatus.name() == 'FAILED'} ? 'badge-danger' : 'badge-secondary')"
                                                      th:text="${command.commandStatus}"></span>
                                            </td>
                                            <td class="small text-gray-600" th:text="${command.resultMessage}"></td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
                <!-- /.container-fluid -->

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <th:block th:replace="~{includes/admin/footer}" />

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <!-- Logout Modal-->
    <th:block th:replace="~{includes/admin/logout}" />

    <!-- Script-->
    <th:block th:replace="~{includes/admin/script}" />

</body>

</html>
