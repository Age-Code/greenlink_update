; Wi-Fi 자격 정보, 서버 주소, 장치 키는 secrets.ini에서 주입한다.
; secrets.ini.example을 secrets.ini로 복사한 뒤 실제 값을 채운다.
[platformio]
extra_configs = secrets.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200
build_flags = ${secrets.build_flags}
#lib_deps =