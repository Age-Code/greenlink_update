server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # 새로 배포하면 바로 반영되도록 진입 파일은 캐시하지 않는다
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    # /login, /home 같은 go_router 경로를 직접 열어도 앱이 뜨도록
    location / {
        try_files $uri $uri/ /index.html;
    }
}
