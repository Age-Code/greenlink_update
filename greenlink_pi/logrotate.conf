# GreenLink Pi 로그 정리 — cron 스크립트가 쌓는 *.log가 SD카드를 채우지 않게 한다.
# 설치: sudo cp logrotate.conf /etc/logrotate.d/greenlink
# 확인: sudo logrotate --debug /etc/logrotate.d/greenlink
/home/greenlink/greenlink/*.log {
    weekly
    rotate 4
    maxsize 5M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su greenlink greenlink
}
