# GreenLink Backend 배포 — 학교 서버(WSL) Docker + Cloudflare 터널
# 저장소 루트에서 실행: docker compose -f docker-compose.prod.yml up -d --build
# 비밀값은 같은 폴더의 .env에 둔다 (.env.example 참고, 커밋 금지).
services:
  app:
    build: ./greenlink_back
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GREENLINK_PORT:-8085}:8080"   # 서버포트:앱포트. 127.0.0.1 = 터널로만 공개
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/greenlink?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: greenlink
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      JAVA_TOOL_OPTIONS: "-Xmx512m"
      TZ: Asia/Seoul
    mem_limit: 768m

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: greenlink
      MYSQL_USER: greenlink
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m

volumes:
  db_data:
